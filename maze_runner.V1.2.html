<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Maze Runner — 500 Seconds</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050711;color:#eaf2ff;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center}
#wrap{width:min(100vw,1100px);height:min(100dvh,calc(100vw * 672 / 1056));aspect-ratio:1056/672;position:relative;overflow:hidden}
canvas{display:block;width:100%;height:100%;max-width:100%;max-height:100%;background:#07101f;image-rendering:auto;border:2px solid #293b5f;box-shadow:0 0 40px #000;touch-action:none;will-change:transform}
button{user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.ctrl{touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .05s ease,background .05s ease}
.ctrl:active,.ctrl.active{transform:scale(.94);background:#27436f}
#hud{position:absolute;top:10px;left:12px;right:12px;display:flex;gap:8px;justify-content:space-between;align-items:flex-start;pointer-events:none}
.panel{background:rgba(5,10,22,.82);border:1px solid #40557e;border-radius:10px;padding:7px 10px;box-shadow:0 4px 16px #0008;backdrop-filter:blur(4px)}
#title{font-weight:900;letter-spacing:1px;font-size:15px}
#stats{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.stat b{color:#ffd65a}
#message{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92%,620px);text-align:center;background:rgba(4,8,18,.94);border:2px solid #667fae;border-radius:18px;padding:24px;display:none;box-shadow:0 16px 60px #000}
#message h1{margin:0 0 10px;font-size:34px}
#message p{margin:8px 0;color:#b9c7df}
button{border:1px solid #5875a8;background:#172847;color:#fff;border-radius:10px;padding:10px 16px;font-weight:800;cursor:pointer}
button:hover{background:#21375f}
#controls{position:absolute;left:12px;bottom:12px;right:12px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
.dpad{display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px;gap:5px;pointer-events:auto}
.ctrl{width:48px;height:48px;border-radius:12px;background:rgba(13,25,47,.82);border:1px solid #5875a8;color:#fff;font-size:20px;touch-action:none}
.ctrl.up{grid-column:2}.ctrl.left{grid-column:1}.ctrl.down{grid-column:2}.ctrl.right{grid-column:3}
.actions{display:flex;gap:8px;pointer-events:auto}
.actions .ctrl{width:72px;font-size:13px}
#tip{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:#050a16cc;border:1px solid #33486e;border-radius:8px;padding:6px 10px;font-size:12px;color:#aebdd7;pointer-events:none}
@media (max-width:700px){
  #wrap{width:100vw;height:100dvh;max-height:100dvh;aspect-ratio:auto}
  canvas{width:100%;height:100%;object-fit:contain}
  #hud{top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));gap:5px}
  #title{font-size:clamp(10px,2.8vw,12px)}
  .panel{padding:5px 7px}
  .stat{font-size:clamp(9px,2.6vw,11px)}
  #tip{display:none}
  #message{width:min(92vw,620px);max-height:80dvh;overflow:auto;padding:clamp(16px,4vw,24px)}
  #message h1{font-size:clamp(22px,7vw,27px)}
  #controls{left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));}
  .dpad{grid-template-columns:clamp(44px,14vw,54px) clamp(44px,14vw,54px) clamp(44px,14vw,54px);grid-template-rows:clamp(44px,14vw,54px) clamp(44px,14vw,54px);gap:4px}
  .ctrl{width:clamp(44px,14vw,54px);height:clamp(44px,14vw,54px);font-size:clamp(17px,5vw,20px)}
  .actions{gap:5px}
  .actions .ctrl{width:clamp(62px,20vw,78px);font-size:clamp(11px,3.5vw,13px)}
}

@media (max-height:500px) and (orientation:landscape){
  #hud{top:5px}
  .panel{padding:4px 6px}
  #controls{bottom:5px}
  .dpad{grid-template-columns:42px 42px 42px;grid-template-rows:42px 42px}
  .ctrl{width:42px;height:42px}
  .actions .ctrl{width:64px}
}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game" width="1056" height="672"></canvas>
<div id="hud">
  <div class="panel" id="title">MAZE RUNNER • 500 SECONDS</div>
  <div class="panel" id="stats">
    <span class="stat">⏱ <b id="time">500.0</b>s</span>
    <span class="stat">🪙 <b id="coins">0</b>/12</span>
    <span class="stat">🔑 <b id="keys">0</b>/3</span>
    <span class="stat">❤️ <b id="lives">3</b></span>
  </div>
</div>
<div id="message">
  <h1 id="msgTitle">MAZE RUNNER</h1>
  <p id="msgText">Kumpulkan 3 kunci, ambil koin, hindari jebakan, lalu capai pintu keluar sebelum 500 detik habis.</p>
  <button id="startBtn">MULAI GAME</button>
</div>
<div id="controls">
  <div class="dpad">
    <button class="ctrl up" data-key="ArrowUp">▲</button>
    <button class="ctrl left" data-key="ArrowLeft">◀</button>
    <button class="ctrl down" data-key="ArrowDown">▼</button>
    <button class="ctrl right" data-key="ArrowRight">▶</button>
  </div>
  <div class="actions">
    <button class="ctrl" data-key="Space">JUMP</button>
    <button class="ctrl" data-key="ShiftLeft">RUN</button>
  </div>
</div>
<div id="tip">Keyboard: WASD / Arrow = bergerak • Space = lompat • Shift = lari cepat</div>
</div>

// ====== Canvas ======
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;
const W = canvas.width, H = canvas.height;
const TILE = 32;
const COLS = 33, ROWS = 19;
const WORLD_W = COLS*TILE, WORLD_H = ROWS*TILE;

const timeEl=document.getElementById("time"), coinsEl=document.getElementById("coins"),
      keysEl=document.getElementById("keys"), livesEl=document.getElementById("lives");
const message=document.getElementById("message"), msgTitle=document.getElementById("msgTitle"),
      msgText=document.getElementById("msgText"), startBtn=document.getElementById("startBtn");

let state="menu", last=0, timeLeft=500, coins=0, keys=0, lives=3, deaths=0;
let maze=[], items=[], hazards=[], checkpoints=[], exitCell=null;
let camera={x:0,y:0};
let input={up:false,down:false,left:false,right:false,space:false,run:false};
let jumpQueued=false;
let player={x:1.5*TILE,y:1.5*TILE,vx:0,vy:0,z:0,vz:0,grounded:true,face:1,anim:0,spawnX:1.5*TILE,spawnY:1.5*TILE,checkpoint:0};
let movingSaws=[];
let particles=[];

// Performance cache: the maze itself never changes during a run, so render it once.
const staticLayer=document.createElement("canvas");
staticLayer.width=W; staticLayer.height=H;
const staticCtx=staticLayer.getContext("2d");
staticCtx.imageSmoothingEnabled=false;
let staticReady=false;
let hudCache={time:"",coins:-1,keys:-1,lives:-1};
let sawClock=0;

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function rand(a,b){return Math.random()*(b-a)+a}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function cellKey(x,y){return x+","+y}
function isFloor(x,y){return x>=0&&y>=0&&x<COLS&&y<ROWS&&maze[y]&&maze[y][x]==="."}
function farthestFrom(sx,sy){
  const q=[[sx,sy]], d={[cellKey(sx,sy)]:0}; let best=[sx,sy],bd=0;
  for(let i=0;i<q.length;i++){
    const [x,y]=q[i];
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx,ny=y+dy,k=cellKey(nx,ny);
      if(isFloor(nx,ny)&&d[k]===undefined){d[k]=d[cellKey(x,y)]+1;q.push([nx,ny]);if(d[k]>bd){bd=d[k];best=[nx,ny]}}
    }
  }
  return best;
}

// Recursive-backtracker maze, expanded to odd/even wall grid.
function buildMaze(){
  maze=Array.from({length:ROWS},()=>Array(COLS).fill("#"));
  const stack=[[1,1]]; maze[1][1]=".";
  while(stack.length){
    const [x,y]=stack[stack.length-1];
    const dirs=shuffle([[2,0],[-2,0],[0,2],[0,-2]]);
    let carved=false;
    for(const [dx,dy] of dirs){
      const nx=x+dx,ny=y+dy;
      if(nx>0&&ny>0&&nx<COLS-1&&ny<ROWS-1&&maze[ny][nx]==="#"){
        maze[y+dy/2][x+dx/2]=".";
        maze[ny][nx]=".";
        stack.push([nx,ny]); carved=true; break;
      }
    }
    if(!carved) stack.pop();
  }
  // Make a few wider junctions so the run feels less claustrophobic.
  for(let i=0;i<12;i++){
    const x=2+((Math.random()*(COLS-4))|0), y=2+((Math.random()*(ROWS-4))|0);
    if(isFloor(x,y)){ if(x+1<COLS-1) maze[y][x+1]="."; if(y+1<ROWS-1) maze[y+1][x]="."; }
  }
}

function makeLevel(){
  buildMaze();
  items=[]; hazards=[]; checkpoints=[]; movingSaws=[]; particles=[];
  const start=[1,1];
  const end=farthestFrom(...start);
  exitCell=end;
  player.spawnX=(start[0]+.5)*TILE; player.spawnY=(start[1]+.5)*TILE;
  player.x=player.spawnX; player.y=player.spawnY; player.z=0; player.vz=0; player.grounded=true;
  player.checkpoint=0;

  // Collectible/obstacle candidate cells.
  let floorCells=[];
  for(let y=1;y<ROWS-1;y++)for(let x=1;x<COLS-1;x++)if(isFloor(x,y)&&!(x===1&&y===1)&&!(x===end[0]&&y===end[1]))floorCells.push([x,y]);
  shuffle(floorCells);

  // 3 keys, 12 coins.
  const used=new Set();
  const place=(type,n)=>{
    let c=0;
    for(const [x,y] of floorCells){
      const k=cellKey(x,y);
      if(used.has(k))continue;
      const md=Math.abs(x-1)+Math.abs(y-1);
      if(md<5)continue;
      used.add(k);items.push({type,x,y,t:Math.random()*6});c++;
      if(c>=n)break;
    }
  };
  place("key",3); place("coin",12);

  // Hazards: lava, spikes and custom circular saws. Jump can bypass them.
  let hcount=0;
  for(const [x,y] of floorCells){
    if(used.has(cellKey(x,y)))continue;
    if(Math.random()<0.11){
      const type=Math.random()<0.46?"lava":(Math.random()<0.5?"spike":"saw");
      const h={type,x,y,t:Math.random()*10};
      if(type==="saw"){
        h.saw={baseX:(x+.5)*TILE,baseY:(y+.5)*TILE,phase:Math.random()*6.28,axis:Math.random()<.5?"x":"y"};
        movingSaws.push(h.saw);
      }
      hazards.push(h);
      used.add(cellKey(x,y)); hcount++;
    }
    if(hcount>38)break;
  }

  // Checkpoints (flags) at distant floor cells.
  const cpCandidates=shuffle(floorCells.slice()).filter(c=>!used.has(cellKey(c[0],c[1])));
  for(let i=0;i<2;i++){
    const c=cpCandidates[i]; if(!c)continue;
    checkpoints.push({x:c[0],y:c[1],reached:false});
    used.add(cellKey(c[0],c[1]));
  }

  // Exit.
  items.push({type:"exit",x:end[0],y:end[1],t:0});
  // Decorative ladders on some floor cells.
  for(let i=0;i<7;i++){
    const c=floorCells[(i*17)%floorCells.length];
    if(c)items.push({type:"ladder",x:c[0],y:c[1],t:0});
  }
  buildStaticLayer();
}

function resetGame(){
  timeLeft=500; coins=0; keys=0; lives=3; deaths=0; state="playing";
  last=performance.now(); sawClock=last;
  makeLevel(); updateHUD(true); message.style.display="none";
}

function updateHUD(force=false){
  const t=Math.max(0,timeLeft).toFixed(1);
  if(force||t!==hudCache.time){timeEl.textContent=t;hudCache.time=t}
  if(force||coins!==hudCache.coins){coinsEl.textContent=coins;hudCache.coins=coins}
  if(force||keys!==hudCache.keys){keysEl.textContent=keys;hudCache.keys=keys}
  if(force||lives!==hudCache.lives){livesEl.textContent=lives;hudCache.lives=lives}
}

function showMessage(title,text,button){
  msgTitle.textContent=title; msgText.textContent=text; startBtn.textContent=button||"MULAI";
  message.style.display="block";
}

function rectHit(px,py,r,tx,ty){
  return Math.abs(px-(tx+.5)*TILE)<r+TILE*.43 && Math.abs(py-(ty+.5)*TILE)<r+TILE*.43;
}
function blocked(px,py,r){
  const minX=Math.floor((px-r)/TILE),maxX=Math.floor((px+r)/TILE);
  const minY=Math.floor((py-r)/TILE),maxY=Math.floor((py+r)/TILE);
  for(let y=minY;y<=maxY;y++)for(let x=minX;x<=maxX;x++)if(!isFloor(x,y))return true;
  return false;
}
function movePlayer(dx,dy){
  const r=9;
  const nx=player.x+dx,ny=player.y+dy;
  if(!blocked(nx,player.y,r))player.x=nx;
  if(!blocked(player.x,ny,r))player.y=ny;
}

function jump(){
  if(player.grounded){player.vz=430;player.grounded=false;spawnDust(player.x,player.y,8)}
}

function die(){
  if(state!=="playing")return;
  state="dying"; deaths++; lives--;
  spawnBurst(player.x,player.y,20);
  if(lives<=0){
    setTimeout(()=>{state="gameover";showMessage("GAME OVER","Kamu kehabisan nyawa. Tekan MULAI ULANG untuk mencoba lagi.","MULAI ULANG")},850);
  }else{
    setTimeout(respawn,850);
  }
}

function respawn(){
  player.x=player.spawnX;player.y=player.spawnY;player.z=0;player.vz=0;player.grounded=true;
  state="playing";
}

function spawnDust(x,y,n){
  for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-60,60),vy:rand(-30,30),life:rand(.25,.5),max:.5,type:"dust"});
}
function spawnBurst(x,y,n){
  for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-130,130),vy:rand(-130,130),life:rand(.35,.8),max:.8,type:"spark"});
}

function update(dt,now){
  if(state!=="playing")return;
  timeLeft-=dt;
  sawClock=now;
  if(timeLeft<=0){timeLeft=0;state="gameover";showMessage("WAKTU HABIS","500 detik sudah habis. Coba lagi dan gunakan tombol RUN untuk melewati bagian panjang.","MULAI ULANG");return}

  // Movement.
  const ax=(input.right?1:0)-(input.left?1:0);
  const ay=(input.down?1:0)-(input.up?1:0);
  const len=Math.hypot(ax,ay)||1;
  const speed=input.run?190:125;
  if(ax||ay){
    movePlayer(ax/len*speed*dt,ay/len*speed*dt);
    player.anim+=dt*(input.run?15:10);
    player.face=ax<0?-1:ax>0?1:player.face;
  }else player.anim+=dt*4;

  if(jumpQueued){jump();jumpQueued=false}
  player.vz-=1000*dt; player.z+=player.vz*dt;
  if(player.z<=0){player.z=0;player.vz=0;player.grounded=true}

  // Hazards.
  for(const h of hazards){
    let hx=h.x,hy=h.y;
    if(h.type==="saw"&&h.saw){
      const s=h.saw;
      if(s.axis==="x")hx=s.baseX/TILE-.5+Math.sin(sawClock/700+s.phase)*9/TILE;
      else hy=s.baseY/TILE-.5+Math.sin(sawClock/700+s.phase)*9/TILE;
    }
    if(h.type==="saw" ? (Math.abs(player.x-(hx+.5)*TILE)<17 && Math.abs(player.y-(hy+.5)*TILE)<17 && player.z<18)
                      : (rectHit(player.x,player.y,8,h.x,h.y) && player.z<18)){
      die(); break;
    }
  }

  // Items.
  for(const it of items){
    if(it.type==="coin"&&rectHit(player.x,player.y,9,it.x,it.y)){
      it.type="taken"; coins++; spawnBurst((it.x+.5)*TILE,(it.y+.5)*TILE,7);
    }else if(it.type==="key"&&rectHit(player.x,player.y,9,it.x,it.y)){
      it.type="taken"; keys++; spawnBurst((it.x+.5)*TILE,(it.y+.5)*TILE,10);
    }
  }

  // Checkpoints.
  checkpoints.forEach((cp,i)=>{
    if(!cp.reached&&rectHit(player.x,player.y,10,cp.x,cp.y)){
      cp.reached=true;player.checkpoint=i+1;
      player.spawnX=(cp.x+.5)*TILE;player.spawnY=(cp.y+.5)*TILE;
      spawnBurst(player.x,player.y,12);
    }
  });

  // Exit needs all keys.
  if(exitCell && rectHit(player.x,player.y,12,exitCell[0],exitCell[1])){
    if(keys>=3){
      state="won";
      showMessage("MAZE SELESAI!","Kamu berhasil keluar dalam "+(500-timeLeft).toFixed(1)+" detik. Koin: "+coins+"/12 • Kematian: "+deaths,"MAIN LAGI");
    }
  }

  // Particles.
  for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=80*dt;p.life-=dt}
  particles=particles.filter(p=>p.life>0);
  updateHUD();
}

function drawImageCrop(img,sx,sy,sw,sh,dx,dy,dw,dh,alpha=1){
  if(!img || !img.complete || !img.naturalWidth)return false;
  ctx.save();ctx.globalAlpha=alpha;ctx.drawImage(img,sx,sy,sw,sh,dx,dy,dw,dh);ctx.restore();
  return true;
}

function buildStaticLayer(){
  staticCtx.clearRect(0,0,W,H);
  staticCtx.fillStyle="#07101f";
  staticCtx.fillRect(0,0,WORLD_W,WORLD_H);

  // Render the expensive maze tiles only once per generated level.
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const px=x*TILE,py=y*TILE;
    if(maze[y][x]==="#"){
      const ok=drawImageCropTo(staticCtx,SHEET,30,45,145,110,px,py,TILE,TILE);
      if(!ok){
        staticCtx.fillStyle="#243452"; staticCtx.fillRect(px,py,TILE,TILE);
        staticCtx.fillStyle="#304467"; staticCtx.fillRect(px+2,py+2,TILE-4,TILE-4);
      }
      staticCtx.fillStyle="rgba(5,10,24,.24)";staticCtx.fillRect(px,py,TILE,TILE);
    }else{
      const ok=drawImageCropTo(staticCtx,SHEET,1010,55,120,120,px,py,TILE,TILE);
      if(!ok){
        staticCtx.fillStyle="#0d1b30"; staticCtx.fillRect(px,py,TILE,TILE);
        staticCtx.fillStyle="#11243d"; staticCtx.fillRect(px+1,py+1,TILE-2,TILE-2);
      }
      staticCtx.fillStyle="rgba(10,20,37,.18)";staticCtx.fillRect(px,py,TILE,TILE);
    }
  }

  staticCtx.strokeStyle="rgba(120,170,220,.05)";
  staticCtx.lineWidth=1;
  for(let x=0;x<=COLS;x++){staticCtx.beginPath();staticCtx.moveTo(x*TILE,0);staticCtx.lineTo(x*TILE,WORLD_H);staticCtx.stroke()}
  for(let y=0;y<=ROWS;y++){staticCtx.beginPath();staticCtx.moveTo(0,y*TILE);staticCtx.lineTo(WORLD_W,y*TILE);staticCtx.stroke()}
  staticReady=true;
}

function drawImageCropTo(target,img,sx,sy,sw,sh,dx,dy,dw,dh,alpha=1){
  if(!img || !img.complete || !img.naturalWidth)return false;
  if(alpha!==1)target.globalAlpha=alpha;
  target.drawImage(img,sx,sy,sw,sh,dx,dy,dw,dh);
  if(alpha!==1)target.globalAlpha=1;
  return true;
}

function drawBlueFairyCharacter(c,x,y,s=1){
  // Karakter original: kulit biru, topi putih, pakaian putih/biru.
  // Semua bentuk dibuat dengan path/ellipse canvas -> tidak memiliki background.
  c.save();
  c.translate(x,y); c.scale(s,s);

  // Bayangan kecil di bawah kaki.
  c.save();
  c.globalAlpha=.28; c.fillStyle="#000";
  c.beginPath(); c.ellipse(0,1,8,2.6,0,0,Math.PI*2); c.fill();
  c.restore();

  // Kaki dan sepatu.
  c.fillStyle="#dfefff";
  c.beginPath(); c.ellipse(-4,-5,3.2,5,0,0,Math.PI*2); c.fill();
  c.beginPath(); c.ellipse(4,-5,3.2,5,0,0,Math.PI*2); c.fill();
  c.fillStyle="#6b91c8";
  c.beginPath(); c.ellipse(-4,-1.2,3.5,2,0,0,Math.PI*2); c.fill();
  c.beginPath(); c.ellipse(4,-1.2,3.5,2,0,0,Math.PI*2); c.fill();

  // Badan biru.
  c.fillStyle="#58a9df";
  c.beginPath(); c.ellipse(0,-12,8.2,9.2,0,0,Math.PI*2); c.fill();
  c.strokeStyle="#2f6f9e"; c.lineWidth=1; c.stroke();

  // Celana putih sederhana.
  c.fillStyle="#f4f7ff";
  c.beginPath(); c.ellipse(0,-7.2,7.2,4.4,0,0,Math.PI*2); c.fill();
  c.strokeStyle="#b9c8dc"; c.stroke();

  // Tangan.
  c.fillStyle="#58a9df";
  c.beginPath(); c.ellipse(-8,-12,2.8,6,Math.PI/8,0,Math.PI*2); c.fill();
  c.beginPath(); c.ellipse(8,-12,2.8,6,-Math.PI/8,0,Math.PI*2); c.fill();
  c.fillStyle="#77bee9";
  c.beginPath(); c.arc(-9.3,-17,2.1,0,Math.PI*2); c.fill();
  c.beginPath(); c.arc(9.3,-17,2.1,0,Math.PI*2); c.fill();

  // Kepala dan telinga.
  c.fillStyle="#63b5e6";
  c.beginPath(); c.arc(-7,-23,3.1,0,Math.PI*2); c.fill();
  c.beginPath(); c.arc(7,-23,3.1,0,Math.PI*2); c.fill();
  c.beginPath(); c.arc(0,-23,8.8,0,Math.PI*2); c.fill();
  c.strokeStyle="#2f6f9e"; c.lineWidth=1; c.stroke();

  // Topi putih khas karakter dongeng biru, tetapi bentuknya original.
  c.fillStyle="#fff";
  c.beginPath();
  c.moveTo(-8.8,-28);
  c.quadraticCurveTo(-4,-33,-.5,-39);
  c.quadraticCurveTo(3,-42,9,-39);
  c.quadraticCurveTo(5,-32,3,-29);
  c.quadraticCurveTo(0,-27,-8.8,-28);
  c.closePath(); c.fill();
  c.strokeStyle="#cbd6e5"; c.stroke();
  c.beginPath(); c.ellipse(0,-28,9.2,2.6,0,0,Math.PI*2); c.fill();

  // Wajah.
  c.fillStyle="#17283b";
  c.beginPath(); c.ellipse(-3.1,-23.8,1.25,1.8,0,0,Math.PI*2); c.fill();
  c.beginPath(); c.ellipse(3.1,-23.8,1.25,1.8,0,0,Math.PI*2); c.fill();
  c.strokeStyle="#28506d"; c.lineWidth=.8;
  c.beginPath(); c.arc(0,-21.5,2.8,.15,Math.PI-.15); c.stroke();

  c.restore();
}

function drawWorld(now){
  ctx.clearRect(0,0,W,H);
  const maxCamX=Math.max(0,WORLD_W-W), maxCamY=Math.max(0,WORLD_H-H);
  camera.x=clamp(player.x-W/2,0,maxCamX);
  camera.y=clamp(player.y-H/2,0,maxCamY);

  ctx.save();ctx.translate(-camera.x,-camera.y);

  // Deep background.
  ctx.fillStyle="#07101f";ctx.fillRect(camera.x,camera.y,W,H);

  // Cached maze + grid: one draw instead of hundreds of drawImage/stroke calls every frame.
  if(staticReady)ctx.drawImage(staticLayer,0,0);

  // Hazards: custom circular saw + existing hazards.
  for(const h of hazards){
    let dx=h.x*TILE,dy=h.y*TILE;
    if(h.type==="lava"){
      drawImageCrop(SHEET,30,452,125,112,dx,dy,TILE,TILE);
    }else if(h.type==="spike"){
      drawImageCrop(SHEET,305,742,125,50,dx,dy+5,TILE,25);
    }else{
      let sx=h.x*TILE+TILE/2, sy=h.y*TILE+TILE/2;
      if(h.saw){
        const offset=Math.sin(now/700+h.saw.phase)*9;
        if(h.saw.axis==="x")sx=h.saw.baseX+offset;
        else sy=h.saw.baseY+offset;
      }
      drawImageCrop(CUSTOM_SAW,0,0,CUSTOM_SAW.naturalWidth,CUSTOM_SAW.naturalHeight,sx-20,sy-20,40,40);
    }
  }

  // Items: coins, keys, exit lock and decorative ladders.
  for(const it of items){
    if(it.type==="taken")continue;
    const dx=it.x*TILE,dy=it.y*TILE;
    if(it.type==="coin")drawImageCrop(SHEET,775,452,42,62,dx+4,dy+1,24,31,0.98);
    if(it.type==="key")drawImageCrop(SHEET,850,570,50,50,dx+3,dy+2,27,27);
    if(it.type==="ladder")drawImageCrop(SHEET,765,655,45,150,dx+7,dy,18,32,.7);
  }

  // Checkpoint flags using the supplied props.
  checkpoints.forEach((cp,i)=>{
    const sx=cp.reached?1140:1010;
    drawImageCrop(SHEET,sx,452,55,90,cp.x*TILE+4,cp.y*TILE-5,25,39);
    if(cp.reached){ctx.fillStyle="#67e8a5";ctx.font="bold 10px system-ui";ctx.fillText("CP"+(i+1),cp.x*TILE+3,cp.y*TILE+8)}
  });

  // Exit: locked door until all keys.
  if(exitCell){
    const ex=exitCell[0]*TILE,ey=exitCell[1]*TILE;
    drawImageCrop(SHEET,1235,570,70,80,ex+2,ey-2,28,34);
    ctx.fillStyle=keys>=3?"#6dffae":"#ffcf4d";
    ctx.font="bold 9px system-ui";ctx.textAlign="center";
    ctx.fillText(keys>=3?"EXIT":"3 KEYS",ex+16,ey+30);ctx.textAlign="left";
  }

  // Player with animated states made from the supplied character asset.
  let bob=0,scaleX=1,scaleY=1,rot=0;
  if(state==="dying"){
    const t=clamp((now%900)/900,0,1);
    rot=t*1.7;scaleX=1+t*.35;scaleY=1-t*.7;
  }else if(player.z>0){
    scaleX=1.08;scaleY=.92;rot=player.vz<0?.08:-.08;
  }else if(input.left||input.right||input.up||input.down){
    bob=Math.sin(player.anim)*2;scaleX=1+(Math.sin(player.anim)*.04);scaleY=1-(Math.sin(player.anim)*.04);
  }else{
    bob=Math.sin(player.anim*.5)*.7;
  }
  // Ukuran karakter disesuaikan dengan grid maze: sekitar 1 tile tinggi,
  // sehingga tidak menutupi lorong dan tetap proporsional dengan jebakan/koin.
  const pw=25*scaleX, ph=38*scaleY;
  const px=player.x,py=player.y-player.z-bob;
  ctx.save();
  ctx.translate(px,py);
  ctx.rotate(rot);
  ctx.scale(player.face,1);
  // Karakter digambar langsung dengan Canvas, bukan memakai JPG/PNG ber-background.
  // Ini menjamin tidak ada kotak/background hitam di belakang karakter.
  ctx.shadowColor="rgba(0,0,0,.45)";
  ctx.shadowBlur=4;
  ctx.shadowOffsetY=3;
  drawBlueFairyCharacter(ctx,0,0,0.90);
  ctx.restore();

  // Particles.
  for(const p of particles){
    ctx.globalAlpha=clamp(p.life/p.max,0,1);
    ctx.fillStyle=p.type==="dust"?"#b9c8d8":"#ffd45a";
    ctx.fillRect(p.x-2,p.y-2,4,4);
  }
  ctx.globalAlpha=1;

  ctx.restore();
}

function keyMap(code,down){
  if(code==="ArrowUp"||code==="KeyW")input.up=down;
  if(code==="ArrowDown"||code==="KeyS")input.down=down;
  if(code==="ArrowLeft"||code==="KeyA")input.left=down;
  if(code==="ArrowRight"||code==="KeyD")input.right=down;
  if(code==="ShiftLeft"||code==="ShiftRight")input.run=down;
  if(code==="Space"&&down)jumpQueued=true;
}
window.addEventListener("keydown",e=>{if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code))e.preventDefault();keyMap(e.code,true)});
window.addEventListener("keyup",e=>keyMap(e.code,false));
window.addEventListener("blur",()=>{
  input.up=input.down=input.left=input.right=input.run=false;
  jumpQueued=false;
  document.querySelectorAll(".ctrl.active").forEach(b=>b.classList.remove("active"));
});

document.querySelectorAll(".ctrl").forEach(btn=>{
  const code=btn.dataset.key;
  const press=e=>{e.preventDefault(); if(code==="Space")jumpQueued=true; else keyMap(code,true)};
  const release=e=>{e.preventDefault(); if(code!=="Space")keyMap(code,false)};
  btn.addEventListener("pointerdown",e=>{btn.setPointerCapture?.(e.pointerId);btn.classList.add("active");press(e)});
  btn.addEventListener("pointerup",e=>{btn.classList.remove("active");release(e)});
  btn.addEventListener("pointercancel",e=>{btn.classList.remove("active");release(e)});
  btn.addEventListener("lostpointercapture",e=>{btn.classList.remove("active");release(e)});
});

startBtn.addEventListener("click",resetGame);
message.style.display="block";

// Mulai langsung. Karakter dibuat dengan Canvas sehingga tidak bergantung pada asset gambar.
// Asset atlas tetap dipakai untuk maze/rintangan dan akan dirender ulang ketika siap.
makeLevel();
updateHUD(true);
drawWorld(performance.now());

CHAR.onload=()=>drawWorld(performance.now());
SHEET.onload=()=>{makeLevel();updateHUD(true);drawWorld(performance.now())};

function loop(t){
  if(!last)last=t;
  const dt=Math.min(.033,(t-last)/1000);last=t;
  update(dt,t);
  drawWorld(t);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
